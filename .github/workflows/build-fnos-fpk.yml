name: Build fnOS Native FPK (x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-fnos-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install web & build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-web.txt pyinstaller httpx

      - name: Run test suite
        run: |
          python3 -m unittest discover -s tests -p "test_web_and_scheduler.py" -v

      - name: Build native x86_64 .fpk package
        run: |
          chmod +x packaging/fnos/build_fpk.sh
          ./packaging/fnos/build_fpk.sh

      - name: Upload .fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: lottery-helper-fnos-x86_64
          path: dist/*.fpk
